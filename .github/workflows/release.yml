name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const resp = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: false,
              prerelease: false
            });
            core.setOutput('id', resp.data.id);
            core.setOutput('upload_url', resp.data.upload_url);
            return resp.data.upload_url;
          result-encoding: string

  build-msi:
    needs: create-release
    runs-on: windows-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install system deps
        run: |
          rustup target add x86_64-pc-windows-msvc
          npm install -g @tauri-apps/cli

      - name: Install npm deps
        run: npm ci

      - name: Build env-config
        run: node build.js

      - name: Build Tauri app
        run: npx tauri build --bundles msi --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload MSI to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const msiDir = 'src-tauri/target/release/bundle/msi';
            const files = fs.readdirSync(msiDir).filter(f => f.endsWith('.msi'));
            if (files.length === 0) throw new Error('No MSI found');
            const msiPath = path.join(msiDir, files[0]);
            const msiBytes = fs.readFileSync(msiPath);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: files[0],
              data: msiBytes.toString('base64'),
              headers: {
                'content-type': 'application/x-msi',
                'content-length': msiBytes.length
              }
            });

      - name: Upload update proxy JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const msiDir = 'src-tauri/target/release/bundle/msi';
            const files = fs.readdirSync(msiDir).filter(f => f.endsWith('.msi'));
            const msiName = files[0];

            const sigPath = path.join(msiDir, msiName + '.sig');
            const sig = fs.existsSync(sigPath) ? fs.readFileSync(sigPath, 'utf-8').trim() : '';

            const tag = '${{ needs.create-release.outputs.tag }}';
            const version = tag.replace(/^v/, '');
            const proxy = {
              version,
              notes: '',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: sig,
                  url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${msiName}`
                }
              }
            };
            const json = JSON.stringify(proxy, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: 'update-proxy.json',
              data: Buffer.from(json).toString('base64'),
              headers: {
                'content-type': 'application/json',
                'content-length': Buffer.byteLength(json)
              }
            });
