name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install deps & build
        run: |
          rustup target add x86_64-pc-windows-msvc
          npm ci
          npx tauri build --bundles msi --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Find MSI name
        id: msi
        shell: bash
        run: |
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi)
          echo "path=$MSI" >> $GITHUB_OUTPUT
          echo "name=$(basename "$MSI")" >> $GITHUB_OUTPUT
          SIG="$MSI.sig"
          if [ -f "$SIG" ]; then echo "sig=$(cat "$SIG")" >> $GITHUB_OUTPUT; fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.msi.outputs.path }}
            ${{ steps.msi.outputs.path }}.sig

      - name: Upload update proxy JSON
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const msiName = '${{ steps.msi.outputs.name }}';
            const sig = '${{ steps.msi.outputs.sig }}';

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });

            const proxy = {
              version,
              notes: '',
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': {
                  signature: sig,
                  url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/${tag}/${msiName}`
                }
              }
            };

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: 'update-proxy.json',
              data: JSON.stringify(proxy, null, 2)
            });
