<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Planner — Sign In</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="env-config.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:  #d4960a;
  --gold2: #f0b429;
  --gold3: #ffd166;
  --dark:  #0c0c0e;
  --card:  rgba(13,13,19,0.84);
  --b1:    rgba(212,150,10,0.20);
  --b2:    rgba(255,255,255,0.06);
  --text:  #e8e8f0;
  --muted: rgba(232,232,240,0.45);
  --err:   #ff5c5c;
  --ok:    #2ecf8c;
}

html, body {
  height: 100%;
  background: var(--dark);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  overflow: hidden;
  user-select: none;
}

/* ── Canvas ── */
#three-canvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
}

/* ── Subtle grid ── */
.grid-bg {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(rgba(212,150,10,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,150,10,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, transparent 25%, black 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, transparent 25%, black 75%);
}

/* ── Vignette ── */
.vignette {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,0.70) 100%);
}

/* ── Page ── */
.page {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 24px 16px;
  padding-bottom: env(safe-area-inset-bottom, 24px);
}

/* ── Card ── */
.card {
  width: 100%; max-width: 400px;
  background: var(--card);
  border: 1px solid var(--b1);
  border-radius: 28px;
  padding: 44px 40px 40px;
  backdrop-filter: blur(36px) saturate(1.5);
  -webkit-backdrop-filter: blur(36px) saturate(1.5);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 0 60px rgba(212,150,10,0.05) inset,
    0 32px 80px rgba(0,0,0,0.65);
  transform-style: preserve-3d;
  transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
  animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
  opacity: 0;
  will-change: transform;
  position: relative; overflow: hidden;
}
@keyframes cardIn {
  from { opacity:0; transform:perspective(1200px) translateY(38px) rotateX(5deg) scale(0.96); }
  to   { opacity:1; transform:perspective(1200px) translateY(0)    rotateX(0)    scale(1);    }
}

/* inner shine */
.card-shine {
  position: absolute; inset: 0; border-radius: 28px; pointer-events: none;
  opacity: 0; transition: opacity 0.3s; z-index: 0;
  background: radial-gradient(380px circle at var(--mx,50%) var(--my,50%),
    rgba(212,150,10,0.07), transparent 60%);
}
.card:hover .card-shine { opacity: 1; }
.card > *:not(.card-shine) { position: relative; z-index: 1; }

/* ── Logo ── */
.logo-wrap { text-align:center; margin-bottom:30px; animation: fadeUp .6s .18s both; }
.logo-icon {
  display: inline-flex; align-items:center; justify-content:center;
  width:64px; height:64px;
  background: linear-gradient(135deg, rgba(212,150,10,0.15), rgba(212,150,10,0.04));
  border: 1px solid rgba(212,150,10,0.28);
  border-radius: 20px; font-size: 28px; margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 28px rgba(212,150,10,0.18);
  animation: iconFloat 4s ease-in-out infinite;
}
@keyframes iconFloat {
  0%,100% { transform:translateY(0) rotateX(0) rotateZ(0);
            box-shadow:0 8px 24px rgba(0,0,0,.35),0 0 28px rgba(212,150,10,.18); }
  40%     { transform:translateY(-6px) rotateX(5deg) rotateZ(1deg);
            box-shadow:0 14px 30px rgba(0,0,0,.28),0 0 44px rgba(212,150,10,.28); }
  70%     { transform:translateY(-3px) rotateX(-3deg) rotateZ(-1deg);
            box-shadow:0 12px 28px rgba(0,0,0,.3),0 0 36px rgba(212,150,10,.22); }
}
.logo-title {
  font-family:'Fraunces',serif; font-size:28px; font-weight:700;
  letter-spacing:-.6px; line-height:1.1; margin-bottom:7px;
  background:linear-gradient(135deg, var(--gold3) 0%, var(--gold2) 45%, var(--gold) 85%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.logo-sub { font-size:13px; color:var(--muted); font-style:italic; letter-spacing:.2px; }

/* ════════════════════════════════
   SLIDING PILL TOGGLE
════════════════════════════════ */
.mode-toggle {
  position: relative;
  display: flex;
  background: rgba(255,255,255,0.035);
  border: 1px solid var(--b2);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 28px;
  animation: fadeUp .6s .28s both;
}
/* the pill that slides */
.toggle-pill {
  position: absolute;
  top: 4px; left: 4px;
  width: calc(50% - 4px);
  height: calc(100% - 8px);
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(212,150,10,0.24), rgba(212,150,10,0.10));
  border: 1px solid rgba(212,150,10,0.32);
  box-shadow: 0 1px 8px rgba(0,0,0,.25), 0 0 12px rgba(212,150,10,.08);
  pointer-events: none;
  /* spring bounce */
  transition: left 0.40s cubic-bezier(0.34, 1.56, 0.64, 1),
              width 0.40s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.toggle-pill.right { left: calc(50%); }

.mode-btn {
  flex: 1; padding: 9px 12px;
  border: none; background: transparent;
  color: var(--muted);
  font-family:'DM Sans',sans-serif; font-size:13.5px; font-weight:500;
  border-radius: 10px; cursor: pointer; outline: none;
  transition: color 0.25s;
  position: relative; z-index: 1;
  -webkit-tap-highlight-color: transparent;
}
.mode-btn.active          { color: var(--gold2); }
.mode-btn:not(.active):hover { color: rgba(232,232,240,.75); }

/* ── Form ── */
.form { display:flex; flex-direction:column; gap:14px; }

.field-wrap { position:relative; animation:fadeUp .5s both; }
.field-wrap:nth-child(1){ animation-delay:.34s }
.field-wrap:nth-child(2){ animation-delay:.42s }
.field-wrap:nth-child(3){ animation-delay:.50s }

.field-label {
  display:block; font-size:11px; font-weight:600;
  color:var(--muted); letter-spacing:.8px; text-transform:uppercase;
  margin-bottom:8px; transition:color .2s;
}
.field-wrap:focus-within .field-label { color:var(--gold2); }

.field-input {
  width:100%; padding:12px 16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px; color:var(--text);
  font-family:'DM Sans',sans-serif; font-size:14.5px;
  outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
  -webkit-appearance:none;
}
.field-input::placeholder { color:rgba(232,232,240,.2); }
.field-input:focus {
  border-color:rgba(212,150,10,.45);
  background:rgba(212,150,10,.04);
  box-shadow:0 0 0 3px rgba(212,150,10,.09),0 2px 8px rgba(0,0,0,.15);
}
.field-input:-webkit-autofill,
.field-input:-webkit-autofill:focus {
  -webkit-box-shadow:0 0 0 100px #0f0f15 inset;
  -webkit-text-fill-color:var(--text);
}

/* ── Submit ── */
.submit-btn {
  position:relative; width:100%; padding:13.5px; margin-top:4px;
  border:none; border-radius:14px;
  background:linear-gradient(135deg,#b87800 0%,#d4960a 45%,#f0a800 100%);
  color:#0c0c0e;
  font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600;
  cursor:pointer; outline:none; overflow:hidden;
  transition:transform .15s,box-shadow .2s,opacity .2s;
  box-shadow:0 4px 22px rgba(212,150,10,.38),0 1px 4px rgba(0,0,0,.3);
  animation:fadeUp .5s .56s both;
  -webkit-tap-highlight-color:transparent;
}
.submit-btn::before {
  content:''; position:absolute;
  top:-50%; left:-75%; width:50%; height:200%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.3),transparent);
  transform:skewX(-20deg); pointer-events:none;
}
.submit-btn:hover::before { animation:shimmer .6s ease forwards; }
@keyframes shimmer { to { left:150%; } }
.submit-btn:hover  { transform:translateY(-2px); box-shadow:0 8px 30px rgba(212,150,10,.48),0 2px 8px rgba(0,0,0,.3); }
.submit-btn:active { transform:translateY(0) scale(.99); box-shadow:0 2px 14px rgba(212,150,10,.28); }
.submit-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
.submit-btn .btn-spinner {
  display:none; width:16px; height:16px;
  border:2px solid rgba(12,12,14,.3); border-top-color:#0c0c0e;
  border-radius:50%; animation:spin .65s linear infinite; margin:0 auto;
}
@keyframes spin { to { transform:rotate(360deg); } }
.submit-btn.loading .btn-text    { display:none; }
.submit-btn.loading .btn-spinner { display:block; }

/* ── Msg ── */
.msg {
  font-size:13px; text-align:center;
  padding:10px 14px; border-radius:10px;
  min-height:38px; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .3s,transform .3s; transform:translateY(4px);
}
.msg.show { opacity:1; transform:translateY(0); }
.msg.error   { background:rgba(255,92,92,.10);  color:var(--err); border:1px solid rgba(255,92,92,.18); }
.msg.success { background:rgba(46,207,140,.10); color:var(--ok);  border:1px solid rgba(46,207,140,.18); }

/* ── Switch ── */
.switch-wrap {
  text-align:center; font-size:13px; color:var(--muted);
  margin-top:18px; animation:fadeUp .5s .62s both;
}
.switch-link { color:var(--gold2); cursor:pointer; font-weight:500; transition:color .2s; }
.switch-link:hover { color:#fff; }

/* ── Footer ── */
.login-footer {
  margin-top:22px; font-size:11.5px;
  color:rgba(232,232,240,.2); letter-spacing:.4px;
  animation:fadeUp .5s .68s both;
}
.login-footer .heart { color:rgba(212,150,10,.45); }

/* ── Success overlay ── */
.success-overlay {
  position:fixed; inset:0; z-index:200; background:var(--dark);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:12px;
  opacity:0; pointer-events:none; transition:opacity .5s;
}
.success-overlay.show { opacity:1; pointer-events:all; }
.success-overlay .s-icon { font-size:46px; animation:popIn .5s cubic-bezier(.22,1,.36,1) both; }
.success-overlay p { font-size:17px; font-weight:500; animation:fadeUp .4s .12s both; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes popIn {
  from { transform:scale(.4) rotate(-12deg); opacity:0; }
  to   { transform:scale(1)  rotate(0deg);   opacity:1; }
}

@media (max-width:440px) {
  .card { padding:34px 22px 30px; border-radius:22px; }
  .logo-title { font-size:24px; }
}
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div class="grid-bg"></div>
<div class="vignette"></div>

<div class="success-overlay" id="successOverlay">
  <div class="s-icon">✦</div>
  <p id="successMsg">Welcome back</p>
</div>

<div class="page">
  <div class="card" id="loginCard">
    <div class="card-shine" id="cardShine"></div>

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-icon">📖</div>
      <p class="logo-title">Study Planner</p>
      <p class="logo-sub">Your personal learning journey ✦</p>
    </div>

    <!-- Pill toggle -->
    <div class="mode-toggle">
      <div class="toggle-pill" id="togglePill"></div>
      <button class="mode-btn active" id="btn-signin" onclick="setMode('signin')">Sign In</button>
      <button class="mode-btn"        id="btn-signup" onclick="setMode('signup')">Create Account</button>
    </div>

    <!-- Form -->
    <form class="form" id="authForm" onsubmit="handleSubmit(event)">
      <div class="field-wrap">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" type="email" id="email"
               placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field-wrap">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password"
               placeholder="••••••••" autocomplete="current-password" required minlength="6">
      </div>
      <div class="field-wrap" id="confirmWrap" style="display:none;">
        <label class="field-label" for="confirm">Confirm Password</label>
        <input class="field-input" type="password" id="confirm"
               placeholder="••••••••" autocomplete="new-password">
      </div>

      <div class="msg" id="authMsg"></div>

      <button class="submit-btn" type="submit" id="submitBtn">
        <span class="btn-text" id="btnLabel">Sign In</span>
        <div class="btn-spinner"></div>
      </button>
    </form>

    <div class="switch-wrap" id="switchWrap">
      Don't have an account?
      <span class="switch-link" onclick="setMode('signup')">Create one</span>
    </div>
  </div>

  <p class="login-footer">Made with <span class="heart">♥</span> for her</p>
</div>

<!-- ═══════════════════════
     THREE.JS 3D SCENE
═══════════════════════ -->
<script>
(function () {
  const canvas   = document.getElementById('three-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 7);

  /* ── Lights ── */
  scene.add(new THREE.AmbientLight(0xffffff, 0.25));

  const goldL = new THREE.PointLight(0xd4960a, 3.5, 18);
  goldL.position.set(4, 4, 3);
  scene.add(goldL);

  const purpL = new THREE.PointLight(0x9b44dd, 2.2, 14);
  purpL.position.set(-5, -2, 2);
  scene.add(purpL);

  const tealL = new THREE.PointLight(0x2ecf8c, 1.6, 12);
  tealL.position.set(0, -6, 2);
  scene.add(tealL);

  /* ── Materials factory ── */
  function wireMat(hex, op)  { return new THREE.MeshBasicMaterial({ color:hex, wireframe:true, transparent:true, opacity:op }); }
  function solidMat(hex, em, shin, op) {
    return new THREE.MeshPhongMaterial({ color:hex, emissive:em, shininess:shin, transparent:true, opacity:op });
  }

  /* ── 1. Large icosahedron wireframe — top right ── */
  const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9, 1), wireMat(0xd4960a, 0.13));
  ico.position.set(4.5, 2.4, -2);
  scene.add(ico);

  /* ── 2. Torus wireframe — left ── */
  const torus = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.44, 10, 26), wireMat(0x9b44dd, 0.12));
  torus.position.set(-4.8, -0.6, -1.2);
  torus.rotation.x = 0.6;
  scene.add(torus);

  /* ── 3. Torus knot — upper left, gold phong ── */
  const knot = new THREE.Mesh(
    new THREE.TorusKnotGeometry(0.85, 0.23, 100, 14, 2, 3),
    solidMat(0xf0a800, 0x5a3a00, 90, 0.6)
  );
  knot.position.set(-3.8, 3.0, -0.5);
  scene.add(knot);

  /* ── 4. Octahedron — lower right, shiny gold ── */
  const oct = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.6, 0),
    solidMat(0xd4960a, 0x8b5a00, 160, 0.88)
  );
  oct.position.set(3.5, -3.0, 0.6);
  scene.add(oct);

  /* ── 5. Thin decorative ring — back plane ── */
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.025, 4, 80), wireMat(0xd4960a, 0.09));
  ring.position.set(1.5, 0.5, -4.5);
  ring.rotation.x = 0.25;
  scene.add(ring);

  /* ── 6. Second smaller ring ── */
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.018, 4, 60), wireMat(0xf0b429, 0.10));
  ring2.position.set(-2.5, -3.5, -3);
  ring2.rotation.y = 0.4;
  scene.add(ring2);

  /* ── 7. Small floating diamonds (octahedra) ── */
  const dData = [
    { pos:[ 2.2,-1.2, 1.2], col:0xd4960a, s:0.19 },
    { pos:[-2.5, 1.8, 0.8], col:0xf0b429, s:0.16 },
    { pos:[ 0.8, 3.6,-1.0], col:0xffd166, s:0.14 },
    { pos:[-1.5,-3.2, 0.5], col:0xc47f00, s:0.20 },
    { pos:[ 3.0, 0.5, 1.0], col:0xe8a800, s:0.12 },
  ];
  const diamonds = dData.map(({ pos, col, s }) => {
    const d = new THREE.Mesh(
      new THREE.OctahedronGeometry(s, 0),
      solidMat(col, 0x6b4500, 220, 0.82)
    );
    d.position.set(...pos);
    scene.add(d);
    return { mesh: d, baseY: pos[1] };
  });

  /* ── 8. Star particles ── */
  const N = 600;
  const pPos = new Float32Array(N * 3);
  for (let i = 0; i < N * 3; i++) pPos[i] = (Math.random() - 0.5) * 32;
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  scene.add(new THREE.Points(pGeo,
    new THREE.PointsMaterial({ color:0xd4960a, size:0.055, transparent:true, opacity:0.30 })
  ));

  /* ── 9. Dodecahedron wireframe — bottom left ── */
  const dodec = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.9, 0),
    wireMat(0x2ecf8c, 0.10)
  );
  dodec.position.set(-2.2, -4.0, -1.0);
  scene.add(dodec);

  /* ── Mouse ── */
  let mx = 0, my = 0, tmx = 0, tmy = 0;
  document.addEventListener('mousemove', e => {
    tmx = (e.clientX / window.innerWidth  - 0.5) * 2;
    tmy = (e.clientY / window.innerHeight - 0.5) * 2;

    /* card tilt + shine */
    const card = document.getElementById('loginCard');
    const shine = document.getElementById('cardShine');
    const r  = card.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width  / 2)) / r.width;
    const dy = (e.clientY - (r.top  + r.height / 2)) / r.height;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 1.4) {
      card.style.transform = `perspective(1200px) rotateX(${-dy*6}deg) rotateY(${dx*7}deg) scale(1.012)`;
      card.style.boxShadow = `0 0 0 1px rgba(255,255,255,.05) inset,${-dx*14}px ${-dy*14}px 70px rgba(0,0,0,.65)`;
    } else {
      card.style.transform = ''; card.style.boxShadow = '';
    }
    shine.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100).toFixed(1) + '%');
    shine.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100).toFixed(1) + '%');
  });
  document.addEventListener('mouseleave', () => {
    const card = document.getElementById('loginCard');
    card.style.transform = ''; card.style.boxShadow = '';
  });

  /* ── Animate ── */
  let t = 0;
  (function loop() {
    requestAnimationFrame(loop);
    t += 0.012;

    mx += (tmx - mx) * 0.04;
    my += (tmy - my) * 0.04;

    ico.rotation.x   += 0.004; ico.rotation.y   += 0.006;
    ico.position.y    = 2.4 + Math.sin(t * 0.5) * 0.22;

    torus.rotation.x += 0.004; torus.rotation.z += 0.003;
    torus.position.y  = -0.6 + Math.sin(t * 0.38 + 1) * 0.26;

    knot.rotation.x  += 0.005; knot.rotation.y  += 0.007;
    knot.position.y   = 3.0 + Math.sin(t * 0.44 + 0.5) * 0.22;

    oct.rotation.x   += 0.011; oct.rotation.y   += 0.009;
    oct.position.y    = -3.0 + Math.sin(t * 0.68 + 2) * 0.18;

    ring.rotation.z  += 0.002; ring.rotation.x  += 0.001;
    ring2.rotation.y += 0.003; ring2.rotation.z += 0.002;

    dodec.rotation.x += 0.004; dodec.rotation.y += 0.005;
    dodec.position.y  = -4.0 + Math.sin(t * 0.5 + 3) * 0.2;

    diamonds.forEach((d, i) => {
      d.mesh.rotation.x += 0.012 + i * 0.003;
      d.mesh.rotation.y += 0.015 + i * 0.002;
      d.mesh.position.y  = d.baseY + Math.sin(t * 0.8 + i * 1.3) * 0.13;
    });

    /* pulsing gold light */
    goldL.intensity = 3.0 + Math.sin(t * 1.6) * 0.7;

    /* camera parallax */
    camera.position.x += (mx * 0.55 - camera.position.x) * 0.03;
    camera.position.y += (-my * 0.35 - camera.position.y) * 0.03;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
  })();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

<!-- ═══════════════
     AUTH LOGIC
═══════════════ -->
<script>
const { createClient } = window.supabase;
const sb = createClient(window.SUPABASE_URL, window.SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true }
});

let currentMode = 'signin';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('togglePill').classList.toggle('right', mode === 'signup');
  document.getElementById('btn-signin').classList.toggle('active', mode === 'signin');
  document.getElementById('btn-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('confirmWrap').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('btnLabel').textContent = mode === 'signin' ? 'Sign In' : 'Create Account';
  document.getElementById('password').setAttribute('autocomplete', mode === 'signup' ? 'new-password' : 'current-password');
  document.getElementById('switchWrap').innerHTML = mode === 'signin'
    ? `Don't have an account? <span class="switch-link" onclick="setMode('signup')">Create one</span>`
    : `Already have an account? <span class="switch-link" onclick="setMode('signin')">Sign in</span>`;
  clearMsg();
}

function showMsg(txt, type) {
  const el = document.getElementById('authMsg');
  el.textContent = txt; el.className = `msg show ${type}`;
}
function clearMsg() {
  const el = document.getElementById('authMsg');
  el.className = 'msg'; el.textContent = '';
}
function setLoading(on) {
  const b = document.getElementById('submitBtn');
  b.classList.toggle('loading', on); b.disabled = on;
}
function showSuccess(email) {
  document.getElementById('successMsg').textContent =
    `Welcome${email ? ', ' + email.split('@')[0] : ''} ✦`;
  document.getElementById('successOverlay').classList.add('show');
  setTimeout(() => { location.href = 'index.html'; }, 1300);
}

async function pushLocalToCloud(userId) {
  const rows = []; const ts = new Date().toISOString();
  ['sp-phases','sp-sched','sp-tasks','sp-streak','sp-settings','sp-kanban','sp-resources','sp-flashcards-v2']
    .forEach(k => { const v = localStorage.getItem(k); if (v) try { rows.push({ user_id:userId, key:k, value:JSON.parse(v), updated_at:ts }); } catch(e){} });
  for (let i = 0; i < 90; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    ['sp-d-','sp-j-','sp-start-times-'].forEach(p => {
      const v = localStorage.getItem(p+dk);
      if (v) try { rows.push({ user_id:userId, key:p+dk, value:JSON.parse(v), updated_at:ts }); } catch(e){}
    });
  }
  if (rows.length) await sb.from('planner_data').upsert(rows, { onConflict:'user_id,key' });
}

async function handleSubmit(e) {
  e.preventDefault(); clearMsg();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const conf  = document.getElementById('confirm').value;

  if (currentMode === 'signup') {
    if (pass !== conf)  { showMsg("Passwords don't match.", 'error'); return; }
    if (pass.length < 6){ showMsg('Password must be at least 6 characters.', 'error'); return; }
  }

  setLoading(true);
  try {
    if (currentMode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      showSuccess(email);
    } else {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) throw error;
      if (data.session) {
        await pushLocalToCloud(data.session.user.id);
        showSuccess(email);
      } else {
        setLoading(false);
        showMsg('Account created! Check your email to confirm, then sign in.', 'success');
        setTimeout(() => setMode('signin'), 3500);
      }
    }
  } catch (err) {
    setLoading(false);
    const map = {
      'Invalid login credentials': 'Incorrect email or password.',
      'Email not confirmed':        'Please confirm your email first.',
      'User already registered':    'That email already has an account.',
    };
    showMsg(map[err.message] || err.message, 'error');
  }
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) location.href = 'index.html';
})();
</script>
</body>
