<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vexo</title>
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Fraunces:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div class="grid-bg"></div>
<div class="vignette"></div>

<div class="page">
  <div class="card" id="loginCard">
    <div class="card-shine" id="cardShine"></div>
    <div class="logo-wrap">
      <div class="logo-icon"><img src="favicon.ico" style="width:36px;height:36px;object-fit:contain;image-rendering:crisp-edges;" alt="Vexo"></div>
      <p class="logo-title">Vexo</p>
      <p class="logo-sub">Your personal learning journey ✦</p>
    </div>
    <div style="text-align:center;padding:40px 20px;">
      <p style="font-size:32px;margin-bottom:12px;">🍩</p>
      <p style="font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px;">Welcome to Vexo</p>
      <p style="font-size:14px;color:var(--muted);margin-bottom:24px;">All data is stored locally on your device. No login required.</p>
      <button onclick="window.location.href='index.html'" style="background:var(--accent);color:#0c0c0e;border:none;border-radius:12px;padding:12px 32px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;">Open App</button>
    </div>
  </div>
  <p class="login-footer">Made with <span class="heart">♥</span> for her</p>
</div>

<script src="js/login/scene.js"></script>
<script>window.location.href='index.html';</script>
</body>
</html>
